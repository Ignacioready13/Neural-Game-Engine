<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Backrooms — Playtest Recording</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #app-canvas {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        cursor: crosshair;
      }
      #hint {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 6px 10px;
        font: 12px/1.4 system-ui, sans-serif;
        color: #ffd;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 220, 0.25);
        border-radius: 4px;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="app-canvas"></canvas>
    <div id="hint">Recording — press <b>Q</b> to finish &amp; save</div>
    <script type="module" src="/src/app/main-record.ts"></script>
  </body>
</html>
